<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trade Hub | Owner Admin</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body class="admin-page">
<header class="header"><a class="logo" href="index.html"><span>TH</span> TRADE HUB</a><a class="nav-cta" href="index.html">View Website</a></header>
<main class="admin-wrap">
<div class="admin-card"><p class="eyebrow">PRIVATE OWNER AREA</p><h1>Trade Hub <em>Product Manager</em></h1><p>This is the front-end admin layout. Connect it to Supabase before using it for real product publishing.</p>

<div class="admin-form"><label>Product Name<input id="adminName" placeholder="e.g. Signature Perfume"></label><label>Category<select id="adminCategory"><option>Perfumes</option><option>Fashion</option><option>Bags</option><option>Shoes</option><option>Beauty</option></select></label><label>MOQ<input id="adminMoq" placeholder="e.g. 24 units"></label><label>Description<textarea id="adminDesc" placeholder="Product description"></textarea></label><label>Image URL<input id="adminImage" placeholder="https://..."></label><button class="btn btn-gold" id="saveProduct">Save Product</button></div>
</div></main>
